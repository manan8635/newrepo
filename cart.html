<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cart · GOOD DEAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head><body>
<div id="shell-header"></div>
<section class="section">
  <div class="container">
    <div class="section-head"><div><h2>Your Cart</h2><p>Free shipping all over India</p></div></div>
    <div id="cartMount"></div>
  </div>
</section>
<div id="shell-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function render(){
  const mount = document.getElementById("cartMount");
  const items = Cart.get();
  if(!items.length){
    mount.innerHTML='<div class="empty"><div class="ico">🛒</div><h3>Your cart is empty</h3><p>Add some awesome tech to get started.</p><a href="products.html" class="btn btn-primary">Shop Now</a></div>';
    return;
  }
  const sub = Cart.subtotal();
  let rows="";
  items.forEach(i=>{
    const p = GD_PRODUCTS.find(x=>x.id===i.id);
    if(!p) return;
    rows += `
      <div class="cart-item">
        <div class="cart-thumb">${productImg(p)}</div>
        <div class="cart-info">
          <h4>${p.name}</h4>
          <div class="meta">${p.cat} · ${fmt(p.price)}</div>
          <div class="cart-controls" style="margin-top:10px">
            <div class="qty">
              <button onclick="Cart.update('${p.id}',${i.qty-1});render()">−</button>
              <input value="${i.qty}" readonly/>
              <button onclick="Cart.update('${p.id}',${i.qty+1});render()">+</button>
            </div>
            <button class="cart-remove" onclick="Cart.remove('${p.id}');render()">🗑 Remove</button>
          </div>
        </div>
        <div style="text-align:right;font-weight:800;font-size:16px">${fmt(p.price*i.qty)}</div>
      </div>`;
  });
  mount.innerHTML = `
    <div class="cart-grid">
      <div class="cart-list">${rows}</div>
      <div class="summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal (${Cart.count()} items)</span><span>${fmt(sub)}</span></div>
        <div class="summary-row"><span>Shipping</span><span class="green">FREE</span></div>
        <div class="summary-row total"><span>Total</span><span>${fmt(sub)}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="margin-top:14px">Proceed to Checkout →</a>
        <a href="products.html" class="btn btn-ghost btn-block" style="margin-top:8px">Continue Shopping</a>
      </div>
    </div>`;
}
render();
</script>
</body></html>
