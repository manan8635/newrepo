<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product · GOOD DEAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head><body>
<div id="shell-header"></div>
<section class="section">
  <div class="container" id="pdMount"></div>
</section>
<div id="shell-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const p = GD_PRODUCTS.find(x=>x.id===id);
const mount = document.getElementById("pdMount");
if(!p){mount.innerHTML='<div class="empty"><div class="ico">🔎</div><h3>Product not found</h3><a class="btn btn-primary" href="products.html">Back to shop</a></div>';}
else{
  const off = Math.round((1 - p.price/p.mrp)*100);
  const specsHTML = Object.entries(p.specs).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  const reviews = GD_REVIEWS.default;
  const revHTML = reviews.map(r=>`
    <div class="review">
      <div class="review-head"><div><span class="review-name">${r.name}</span><span class="review-date">· ${r.date}</span></div><div class="review-stars">${stars(r.rating)}</div></div>
      <p class="review-text">${r.text}</p>
    </div>`).join("");
  mount.innerHTML = `
    <div class="pd-grid">
      <div>
        <div class="pd-gallery" id="mainImg">${productImg(p)}</div>
        <div class="pd-thumbs">
          <div class="pd-thumb active">${productImg(p)}</div>
          <div class="pd-thumb">📦</div>
          <div class="pd-thumb">🛡️</div>
          <div class="pd-thumb">⚡</div>
        </div>
      </div>
      <div class="pd-info">
        <div class="pd-cat">${p.cat}</div>
        <h1>${p.name}</h1>
        <div class="pd-rating-row"><span style="color:var(--warning)">${stars(4.6)}</span><span style="color:var(--muted);font-size:13px">4.6 · ${randCount()} reviews</span></div>
        <div class="pd-price">${fmt(p.price)} <small>${fmt(p.mrp)}</small> ${off>0?`<span class="off">${off}% OFF</span>`:""}</div>
        <p class="pd-desc">${p.desc}</p>
        <div class="pd-actions">
          <div class="qty">
            <button onclick="qc(-1)">−</button>
            <input id="qty" value="1" readonly/>
            <button onclick="qc(1)">+</button>
          </div>
          <button class="btn btn-primary" onclick="Cart.add('${p.id}',+document.getElementById('qty').value)">🛒 Add to Cart</button>
          <a href="cart.html" class="btn btn-outline" onclick="Cart.add('${p.id}',+document.getElementById('qty').value)">Buy Now</a>
        </div>
        <div class="pd-specs"><h3>Specifications</h3><dl>${specsHTML}</dl></div>
      </div>
    </div>
    <div class="reviews">
      <h2 style="font-size:24px;font-weight:800;margin-bottom:16px">Customer Reviews</h2>
      ${revHTML}
    </div>`;
  document.title = p.name + " · GOOD DEAL";
}
function qc(d){const i=document.getElementById("qty");i.value=Math.max(1,+i.value+d)}
document.addEventListener("click",e=>{
  if(e.target.classList.contains("pd-thumb")){
    document.querySelectorAll(".pd-thumb").forEach(t=>t.classList.remove("active"));
    e.target.classList.add("active");
    document.getElementById("mainImg").textContent = e.target.textContent;
  }
});
</script>
</body></html>
